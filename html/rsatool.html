<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>RSA Encryptor/Decryptor</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<style>
		* {
			font-family: "Trebuchet MS", Helvetica, sans-serif;
		}

		div {
			margin: 12px 0;
		}

		p {
			white-space: pre-wrap;
		}
		</style>
		<script>
		let encryptedOutput;
		let pElem;
		let qElem;
		let nElem;
		let key1Elem;
		let key2Elem;
		let key3Elem;
		let key4Elem;
		let encryptTxt;
		let factorElem;

		function setup() {
			pElem = document.getElementById("p");
			qElem = document.getElementById("q");
			nElem = document.getElementById("n");
			key1Elem = document.getElementById("key1");
			key2Elem = document.getElementById("key2");
			key3Elem = document.getElementById("key3");
			key4Elem = document.getElementById("key4");
			factorElem = document.getElementById("factorText");
			encryptElem = document.getElementById("encryptText");
			decryptElem = document.getElementById("decryptText");
			encryptedOutput = document.getElementById("encryptedOutput");
			decryptedOutput = document.getElementById("decryptedOutput");
		}

		// From https://en.wikipedia.org/wiki/Modular_exponentiation
		function modExp(base, exponent, modulus) {
			if (modulus === 1) return 0;
			let result = 1;
			base %= modulus;
			while (exponent > 0) {
				if (exponent % 2 === 1) {
					result = (result * base) % modulus;
				}
				exponent = exponent >> 1; // Divide by 2
				base = (base * base) % modulus;
			}
			return result;
		}

		// From https://cp-algorithms.com/algebra/factorization.html
		function primeFactorise(n) {
			const factors = [];
			if (!n || n < 2) return factors;
			while (n % 2 === 0) {
				factors.push(2);
				n /= 2;
			}
			for (let i = 3; i * i <= n; i += 2) {
				while (n % i === 0) {
					factors.push(i);
					n /= i;
				}
			}
			if (n > 1) {
				factors.push(n);
			}
			return factors;
		}

		// From https://stackoverflow.com/a/51562038
		function modInverse(a, m) {
			if (m === 1) return 0;
			a = (a % m + m) % m;
			if (!a || m < 2) {
				return NaN;
			}
			// Find the GCD
			const s = [];
			let b = m;
			while (b) {
				[a, b] = [b, a % b];
				s.push([a, b]);
			}
			if (a !== 1) {
				return NaN; // Inverse does not exists
			}
			// Find the inverse
			let x = 1;
			let y = 0;
			for (let i = s.length - 2; i >= 0; --i) {
				[x, y] = [y,  x - y * Math.floor(s[i][0] / s[i][1])];
			}
			return (y % m + m) % m;
		}

		function encryptValue() {
			const str = encryptElem.value.toUpperCase();
			if (str.trim() === "") return;
			const keyNumber1 = parseFloat(key1Elem.value);
			const keyNumber2 = parseFloat(key2Elem.value);
			if (isNaN(keyNumber1) || isNaN(keyNumber2)) {
				encryptedOutput.textContent = "Waiting for valid key numbers...";
			} else {
				let equation = "";
				let encrypted = "";
				for (let i = 0; i < str.length; i++) {
					const asciiCode = str.charCodeAt(i) - 64;
					// Calculate C = M^e (mod pq)
					const encryptResult = modExp(asciiCode, keyNumber1, keyNumber2);
					equation += `Index of letter ${str.charAt(i)} = ${asciiCode}\n`;
					equation += `${asciiCode}^${keyNumber1} (mod ${keyNumber2}) = ${encryptResult}\n\n`;
					encrypted += encryptResult + " ";
				}
				encryptedOutput.textContent = `${equation}Encrypted message: ${encrypted}`;
			}
		}

		function decryptValue() {
			const str = decryptElem.value;
			if (str.trim() === "") return;
			const keyNumber2 = parseFloat(key2Elem.value);
			const keyNumber4 = parseFloat(key4Elem.value);
			if (isNaN(keyNumber2) || isNaN(keyNumber4)) {
				decryptedOutput.textContent = "Waiting for valid key numbers...";
			} else {
				const numberList = str.split(" ");
				let equation = "";
				let decrypted = "";
				for (let i = 0; i < numberList.length; i++) {
					const num = parseFloat(numberList[i]);
					if (isNaN(num)) continue;
					// Calculate M = C^d (mod pq)
					const decryptResult = modExp(num, keyNumber4, keyNumber2);
					const letter = String.fromCharCode(decryptResult + 64);
					equation += `${num}^${keyNumber4} (mod ${keyNumber2}) = ${decryptResult}\n`;
					equation += `Letter at index ${decryptResult} = ${letter}\n\n`;
					decrypted += letter;
				}
				decryptedOutput.textContent = `${equation}Decrypted message: ${decrypted}`;
			}
		}

		function calculatePrivateKey(p, q) {
			if (!p) {
				p = parseFloat(pElem.value);
				if (isNaN(p)) {
					key4.value = "";
					return;
				}
			}
			if (!q) {
				q = parseFloat(qElem.value);
				if (isNaN(q)) {
					key4.value = "";
					return;
				}
			}
			const e = parseFloat(key3Elem.value);
			if (isNaN(e)) {
				key4.value = "";
				return;
			}
			// Calculate (p - 1)(q - 1)
			const n = (p - 1) * (q - 1);
			// Calculate e^-1 (mod (p - 1)(q - 1))
			key4.value = modInverse(e, n);
		}

		function calculatePQ() {
			const num = parseFloat(nElem.value);
			if (isNaN(num)) {
				factorElem.textContent = "";
				return;
			}
			const factors = displayFactors(num);
			if (factors.length === 2) {
				const p = factors[0];
				const q = factors[1];
				pElem.value = p;
				qElem.value = q;
				calculatePrivateKey(p, q);
			} else {
				pElem.value = "";
				qElem.value = "";
			}
			encryptValue();
			decryptValue();
		}

		function calculateN() {
			const p = parseFloat(pElem.value);
			const q = parseFloat(qElem.value);
			if (isNaN(p) || isNaN(q)) {
				factorElem.textContent = "";
				nElem.value = "";
				key2.value = "";
				return;
			}
			const product = p * q;
			displayFactors(product);
			nElem.value = product;
			key2.value = product;
			calculatePrivateKey(p, q);
			encryptValue();
			decryptValue();
		}

		function displayFactors(num) {
			const factors = primeFactorise(num);
			factorElem.textContent = `Prime factors (possible p or q): ${factors.join(", ")}`;
			return factors;
		}

		function nModified() {
			key2.value = nElem.value;
			calculatePQ();
		}

		function key1Modified() {
			key3.value = key1.value;
			calculatePrivateKey();
			encryptValue();
		}

		function key2Modified() {
			nElem.value = key2.value;
			calculatePQ();
		}

		function key3Modified() {
			key1.value = key3.value;
			calculatePrivateKey();
			encryptValue();
			decryptValue();
		}
		</script>
	</head>
	<body onload="setup();">
		<h1>RSA Encryptor/Decryptor</h1>
		<p>This was designed for MATH221. It is too slow for real world RSA cases.</p>
		<p>Please enter any values you can. It fills in missing values where possible.</p>
		<div>
			<label for="p">p: </label>
			<input id="p" type="number" placeholder="prime number" oninput="calculateN();">
		</div>
		<div>
			<label for="q">q: </label>
			<input id="q" type="number" placeholder="prime number" oninput="calculateN();">
		</div>
		<div>
			<label for="n">Product of p and q: </label>
			<input id="n" type="number" placeholder="p * q" oninput="nModified();">
			<p id="factorText"></p>
		</div>
		<div>
			<label for="key1">Public key, e.g. (11, 91):</label>
		</div>
		<div>
			(<input id="key1" type="number" placeholder="e" oninput="key1Modified();">, <input id="key2" type="number" placeholder="p * q" oninput="key2Modified();">)
		</div>
		<div>
			<label for="key3">Private key, e.g. (11, 59):</label>
		</div>
		<div>
			(<input id="key3" type="number" placeholder="e" oninput="key3Modified();">, <input id="key4" type="number" placeholder="e^-1 (mod (p - 1)(q - 1))" oninput="decryptValue();">)
		</div>
		<h2>Encrypt</h2>
		<div>
			<label for="encryptText">Enter some text to encrypt:</label>
		</div>
		<div>
			<input id="encryptText" type="text" placeholder="FUN" oninput="encryptValue();">
			<p id="encryptedOutput"></p>
		</div>
		<h2>Decrypt</h2>
		<div>
			<label for="decryptText">Enter some numbers to encrypt:</label>
		<div>
		</div>
			<input id="decryptText" type="text" placeholder="76 70 14" oninput="decryptValue();">
			<p id="decryptedOutput"></p>
		</div>
	</body>
</html>
